<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tulips Test</title>
  <style>
    body {
      margin: 0;
      background: #FAF8F5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
    }
    .garden {
      display: flex;
      gap: 30px;
      align-items: flex-end;
      background: rgba(200, 168, 130, 0.12);
      padding: 40px 60px;
      border-radius: 24px;
      border: 1px solid rgba(200, 168, 130, 0.25);
    }
    .tulip-svg {
      transform-origin: bottom center;
      animation: tulipSway 4s ease-in-out infinite alternate;
      filter: drop-shadow(0 8px 12px rgba(90, 60, 30, 0.12));
    }
    .t1 { animation-delay: 0s; width: 90px; height: 160px; }
    .t2 { animation-delay: -1.2s; width: 80px; height: 140px; }
    .t3 { animation-delay: -2.5s; width: 95px; height: 170px; }
    .t4 { animation-delay: -0.7s; width: 85px; height: 150px; }

    @keyframes tulipSway {
      0% { transform: rotate(-2.5deg); }
      100% { transform: rotate(3deg); }
    }
  </style>
</head>
<body>
  <h2 style="color:#795548;margin-bottom:20px;">Romantic Botanical Tulips Preview</h2>
  <div class="garden">
    <!-- Tulip 1: Blush Peach -->
    <svg class="tulip-svg t1" viewBox="0 0 120 220">
      <defs>
        <linearGradient id="stemG1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#8FA382"/>
          <stop offset="100%" stop-color="#6E8262"/>
        </linearGradient>
        <linearGradient id="leafG1" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#9DB390" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#788D6C" stop-opacity="0.85"/>
        </linearGradient>
        <linearGradient id="pBack1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#EAA296"/>
          <stop offset="100%" stop-color="#C8786B"/>
        </linearGradient>
        <linearGradient id="pLeft1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#F5BDB3"/>
          <stop offset="100%" stop-color="#D98577"/>
        </linearGradient>
        <linearGradient id="pRight1" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#EDAAA0"/>
          <stop offset="100%" stop-color="#C87567"/>
        </linearGradient>
        <linearGradient id="pCenter1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FCE0DA"/>
          <stop offset="60%" stop-color="#F0ABA0"/>
          <stop offset="100%" stop-color="#D1796B"/>
        </linearGradient>
      </defs>
      <path d="M58 80 C56 120, 60 170, 58 220" stroke="url(#stemG1)" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M58 180 C40 160, 20 120, 26 85 C32 105, 48 135, 58 150 Z" fill="url(#leafG1)"/>
      <path d="M58 195 C75 175, 95 135, 90 95 C86 118, 72 145, 58 165 Z" fill="url(#leafG1)"/>
      <g transform="translate(58, 70)">
        <path d="M0 -42 C-14 -32, -18 -8, 0 12 C18 -8, 14 -32, 0 -42 Z" fill="url(#pBack1)"/>
        <path d="M0 12 C-16 10, -28 -10, -22 -32 C-18 -42, -6 -38, -2 -22 C-10 -6, -8 4, 0 12 Z" fill="url(#pLeft1)"/>
        <path d="M0 12 C16 10, 28 -10, 22 -32 C18 -42, 6 -38, 2 -22 C10 -6, 8 4, 0 12 Z" fill="url(#pRight1)"/>
        <path d="M0 14 C-14 12, -16 -12, -8 -36 C-2 -44, 2 -44, 8 -36 C16 -12, 14 12, 0 14 Z" fill="url(#pCenter1)"/>
        <ellipse cx="0" cy="13" rx="6" ry="3" fill="#7A8E6E"/>
      </g>
    </svg>

    <!-- Tulip 2: Warm Champagne Cream -->
    <svg class="tulip-svg t2" viewBox="0 0 120 220">
      <defs>
        <linearGradient id="pBack2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#EFE5D8"/>
          <stop offset="100%" stop-color="#D4C2AB"/>
        </linearGradient>
        <linearGradient id="pLeft2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#FFFDF9"/>
          <stop offset="100%" stop-color="#E8D9C5"/>
        </linearGradient>
        <linearGradient id="pRight2" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#F8EFE4"/>
          <stop offset="100%" stop-color="#DFCEB8"/>
        </linearGradient>
        <linearGradient id="pCenter2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFFFFF"/>
          <stop offset="60%" stop-color="#F5ECE0"/>
          <stop offset="100%" stop-color="#DECBB5"/>
        </linearGradient>
      </defs>
      <path d="M60 80 C62 120, 58 170, 60 220" stroke="url(#stemG1)" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M60 185 C78 165, 96 125, 90 90 C85 110, 70 140, 60 155 Z" fill="url(#leafG1)"/>
      <path d="M60 170 C42 150, 24 115, 30 80 C34 100, 48 130, 60 145 Z" fill="url(#leafG1)"/>
      <g transform="translate(60, 70)">
        <path d="M0 -42 C-14 -32, -18 -8, 0 12 C18 -8, 14 -32, 0 -42 Z" fill="url(#pBack2)"/>
        <path d="M0 12 C-16 10, -28 -10, -22 -32 C-18 -42, -6 -38, -2 -22 C-10 -6, -8 4, 0 12 Z" fill="url(#pLeft2)"/>
        <path d="M0 12 C16 10, 28 -10, 22 -32 C18 -42, 6 -38, 2 -22 C10 -6, 8 4, 0 12 Z" fill="url(#pRight2)"/>
        <path d="M0 14 C-14 12, -16 -12, -8 -36 C-2 -44, 2 -44, 8 -36 C16 -12, 14 12, 0 14 Z" fill="url(#pCenter2)"/>
        <ellipse cx="0" cy="13" rx="6" ry="3" fill="#7A8E6E"/>
      </g>
    </svg>

    <!-- Tulip 3: Terracotta Amber -->
    <svg class="tulip-svg t3" viewBox="0 0 120 220">
      <defs>
        <linearGradient id="pBack3" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#E29252"/>
          <stop offset="100%" stop-color="#BD6A2C"/>
        </linearGradient>
        <linearGradient id="pLeft3" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#F2AE74"/>
          <stop offset="100%" stop-color="#D97A38"/>
        </linearGradient>
        <linearGradient id="pRight3" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#EAA165"/>
          <stop offset="100%" stop-color="#C96E2E"/>
        </linearGradient>
        <linearGradient id="pCenter3" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FAD0A8"/>
          <stop offset="60%" stop-color="#EDA468"/>
          <stop offset="100%" stop-color="#D47330"/>
        </linearGradient>
      </defs>
      <path d="M58 80 C55 120, 62 170, 58 220" stroke="url(#stemG1)" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M58 180 C38 160, 18 120, 24 85 C30 105, 46 135, 58 150 Z" fill="url(#leafG1)"/>
      <path d="M58 195 C78 175, 98 135, 92 95 C88 118, 74 145, 58 165 Z" fill="url(#leafG1)"/>
      <g transform="translate(58, 70)">
        <path d="M0 -42 C-14 -32, -18 -8, 0 12 C18 -8, 14 -32, 0 -42 Z" fill="url(#pBack3)"/>
        <path d="M0 12 C-16 10, -28 -10, -22 -32 C-18 -42, -6 -38, -2 -22 C-10 -6, -8 4, 0 12 Z" fill="url(#pLeft3)"/>
        <path d="M0 12 C16 10, 28 -10, 22 -32 C18 -42, 6 -38, 2 -22 C10 -6, 8 4, 0 12 Z" fill="url(#pRight3)"/>
        <path d="M0 14 C-14 12, -16 -12, -8 -36 C-2 -44, 2 -44, 8 -36 C16 -12, 14 12, 0 14 Z" fill="url(#pCenter3)"/>
        <ellipse cx="0" cy="13" rx="6" ry="3" fill="#7A8E6E"/>
      </g>
    </svg>

    <!-- Tulip 4: Romantic Rose -->
    <svg class="tulip-svg t4" viewBox="0 0 120 220">
      <defs>
        <linearGradient id="pBack4" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#DF9FA9"/>
          <stop offset="100%" stop-color="#BD7481"/>
        </linearGradient>
        <linearGradient id="pLeft4" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#EDB7C0"/>
          <stop offset="100%" stop-color="#D38694"/>
        </linearGradient>
        <linearGradient id="pRight4" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#E5A6B1"/>
          <stop offset="100%" stop-color="#C57584"/>
        </linearGradient>
        <linearGradient id="pCenter4" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FCE1E6"/>
          <stop offset="60%" stop-color="#EAA6B2"/>
          <stop offset="100%" stop-color="#CE7E8C"/>
        </linearGradient>
      </defs>
      <path d="M60 80 C58 120, 62 170, 60 220" stroke="url(#stemG1)" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M60 175 C42 155, 22 120, 28 85 C34 105, 50 135, 60 150 Z" fill="url(#leafG1)"/>
      <path d="M60 190 C78 170, 96 130, 92 92 C88 115, 74 142, 60 162 Z" fill="url(#leafG1)"/>
      <g transform="translate(60, 70)">
        <path d="M0 -42 C-14 -32, -18 -8, 0 12 C18 -8, 14 -32, 0 -42 Z" fill="url(#pBack4)"/>
        <path d="M0 12 C-16 10, -28 -10, -22 -32 C-18 -42, -6 -38, -2 -22 C-10 -6, -8 4, 0 12 Z" fill="url(#pLeft4)"/>
        <path d="M0 12 C16 10, 28 -10, 22 -32 C18 -42, 6 -38, 2 -22 C10 -6, 8 4, 0 12 Z" fill="url(#pRight4)"/>
        <path d="M0 14 C-14 12, -16 -12, -8 -36 C-2 -44, 2 -44, 8 -36 C16 -12, 14 12, 0 14 Z" fill="url(#pCenter4)"/>
        <ellipse cx="0" cy="13" rx="6" ry="3" fill="#7A8E6E"/>
      </g>
    </svg>
  </div>
</body>
</html>
